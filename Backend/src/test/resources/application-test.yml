spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    port: 5672
    host: localhost
    username: guest
    password: guest
  mail:
    host: smtp.gmail.com
    port: 587
    username: test
    password: test

rabbitmq:
  exchange:
    name: internship_exchange
  queue:
    notification: notification_queue
  routing:
    key:
      notification: notification_routing_key

app:
  frontend:
    url: "http://localhost:5173"

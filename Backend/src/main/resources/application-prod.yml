logging:
  level:
    pka:
      edu: INFO
    root: INFO
spring:
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    port: 5672
    host: rabbitmq
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:internship_db}
    username: ${DB_USERNAME:postgres}
    hikari:
      maximum-pool-size: 50
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.sendgrid.net
    port: 2525
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
rabbitmq:
  exchange:
    name: internship_exchange
  queue:
    notification: notification_queue
  routing:
    key:
      notification: notification_routing_key

app:
  mail:
    sender: ${MAIL_SENDER:noreply@yourdomain.com}
  frontend:
    url: ${FRONTEND_URL}